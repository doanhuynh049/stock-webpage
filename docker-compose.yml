services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: vnstocks
      POSTGRES_PASSWORD: vnstocks
      POSTGRES_DB: vnstocks
    volumes:
      - vnstocks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnstocks -d vnstocks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vnstocks_pgdata:
