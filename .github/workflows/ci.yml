name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Build-time only — no route in this app performs DB access during
      # `next build` (all pages are dynamic/session-gated), so a placeholder
      # is enough to satisfy Prisma's schema/env validation.
      DATABASE_URL: "postgresql://user:password@localhost:5432/stockwebpage"
      AUTH_SECRET: "ci-placeholder-secret-not-for-production-use"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
